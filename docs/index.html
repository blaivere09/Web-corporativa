<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLogístic S.A. | Logística 100% Legal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- BANNER DE COOKIES -->
    <div id="cookieBox" class="cookie-banner">
        <div class="cookie-content">
            <p>Utilitzem cookies per millorar la seva experiència. Pot acceptar-les o configurar-les a la nostra <a href="cookies.html">Política de Cookies</a>.</p>
            <div class="cookie-buttons">
                <button onclick="acceptarCookies()">Acceptar totes</button>
                <button onclick="acceptarCookies()" style="background:#555;">Rebutjar</button>
            </div>
        </div>
    </div>

    <header>
        <div class="logo"><img src="FoodLogisticLogo.png" alt="FoodLogístic S.A."></div>
        <nav>
            <a href="#empresa">Empresa</a>
            <a href="#contacte">Contacte</a>
        </nav>
    </header>

    <section class="hero">
        <h1>FoodLogístic S.A.</h1>
        <p>Solucions logístiques professionals i segures.</p>
    </section>

    <!-- FORMULARI DE CONTACTE LEGAL -->
    <section id="contacte" class="form-section">
        <div class="form-container">
            <h2>Formulari de Contacte</h2>
            <form id="contactForm">
                <input type="text" id="nom" placeholder="Nom complet" required>
                <input type="email" id="email" placeholder="Correu electrònic" required>
                <input type="tel" id="tel" placeholder="Telèfon de contacte" required>
                <textarea id="msg" rows="4" placeholder="El seu missatge" required></textarea>

                <!-- CHECKBOX 1: PRIVACITAT (OBLIGATORI) -->
                <div class="checkbox-group">
                    <input type="checkbox" id="checkPrivacitat" required>
                    <label for="checkPrivacitat">Accepto la <a href="privacitat.html">política de privacitat</a> i el tractament de les meves dades. (Obligatori)</label>
                </div>

                <!-- CHECKBOX 2: COMUNICACIONS (OPCIONAL) -->
                <div class="checkbox-group">
                    <input type="checkbox" id="checkComercial">
                    <label for="checkComercial">Autoritzo l'enviament de comunicacions comercials segons l'<a href="avis-legal.html">avís legal</a>.</label>
                </div>

                <button type="submit">Enviar Sol·licitud</button>
            </form>
        </div>
    </section>

    <footer>
        <p>FoodLogistic S.A. | NIF: A08123456 | <a href="avis-legal.html">Avís Legal</a> | <a href="privacitat.html">Privacitat</a> | <a href="cookies.html">Cookies</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
